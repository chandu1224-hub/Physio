[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Public browser configuration only (publishable key, protected by Row Level Security). Never put a service-role key here.
  VITE_SUPABASE_URL = "https://libbqaznznsfxxnclsmp.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_-ndptxhysUA3j34qNODY7w_zmns3MWD"
  VITE_SITE_URL = "https://physioathomes.netlify.app"

# SPA fallback so /admin works on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://libbqaznznsfxxnclsmp.supabase.co wss://libbqaznznsfxxnclsmp.supabase.co https://photon.komoot.io https://api.geoapify.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://wa.me https://api.whatsapp.com"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
