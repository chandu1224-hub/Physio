name: Physio at Home CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "physio-at-home/**"
      - ".github/workflows/physio-at-home-ci.yml"

permissions:
  contents: read

concurrency:
  group: physio-at-home-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: physio-at-home
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: physio-at-home/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
