name: Physio at Home CI

on:
  pull_request:
    paths:
      - "physio-at-home/**"
      - ".github/workflows/physio-ci.yml"
  push:
    branches:
      - main
      - "work/production-readiness"
    paths:
      - "physio-at-home/**"
      - ".github/workflows/physio-ci.yml"

permissions:
  contents: read

jobs:
  build:
    name: Install and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: physio-at-home
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: physio-at-home/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
